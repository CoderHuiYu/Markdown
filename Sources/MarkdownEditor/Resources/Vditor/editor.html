<!--
THESIS: Reading and editing are one continuous document; the separate raw-source editor is deliberately absent.
OWN-WORLD: System surfaces, restrained controls, the existing Earbuds type scale, gradient heading marks, and green task state.
STORY: A note renders immediately, becomes directly editable, and returns canonical Markdown without visual mode drift.
FIRST VIEWPORT: The document owns the canvas edge to edge; formatting appears only above the keyboard while text has focus.
FORM: Established-reader extension in Operate/Read mode; seed established-reader-extension.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->
<main id="editor-shell">
    <div id="editor" aria-label="Markdown 笔记"></div>
</main>
